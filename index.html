<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toedin</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://use.typekit.net/oov2wcw.css" />
  </head>
  <body>
    <div class="container">
      <h1>Tic Tac Toedin</h1>
      <div class="game-board" id="gameBoard">
        <h2 class="currentPlayer">Current Player: X</h2>
        <div class="cell" data-index="0" onclick="ticTacToe.makeMove(0,0,this)" ></div>
        <div class="cell" data-index="1" onclick="ticTacToe.makeMove(0, 1,this)" ></div>
        <div class="cell" data-index="2" onclick="ticTacToe.makeMove(0,2,this)"></div> 
        <div class="cell" data-index="3" onclick="ticTacToe.makeMove(1,0,this)"></div>
        <div class="cell" data-index="4" onclick="ticTacToe.makeMove(1,1,this)"></div>
        <div class="cell" data-index="5" onclick="ticTacToe.makeMove(1,2,this)"></div>
        <div class="cell" data-index="6" onclick="ticTacToe.makeMove(2,0,this)"></div>
        <div class="cell" data-index="7" onclick="ticTacToe.makeMove(2,1,this)"></div>
        <div class="cell" data-index="8" onclick="ticTacToe.makeMove(2,2,this)"></div>
      </div>
      <button id="reset-button" onclick="ticTacToe.resetGame();">Reset</button>
    </div>
</body>
<script src="script.js"></script>
</html>
